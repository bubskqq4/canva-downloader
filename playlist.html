<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catify - Spotify Playlist Copier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🐾 Catify Playlist Copier 🐾</h1>
    <p>Paste your Spotify playlist link below to fetch the playlist tracks:</p>
    
    <input type="text" id="playlist-link" placeholder="https://open.spotify.com/playlist/..." />
    <button id="copy-playlist-btn">Copy Playlist 🐱</button>
    
    <ul id="playlist-tracks" style="display:none;"></ul>

    <footer>
      <p>Made with 💜 and cat vibes by Ethan</p>
    </footer>
  </div>

  <script src="playlist.js" defer></script>
</body>
</html>
