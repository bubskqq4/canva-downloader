<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catify - Spotify Canvas Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🐾 Catify Canvas Downloader 🐾</h1>
    <p>Paste your Spotify song link below to fetch the canvas (or album image):</p>
    
    <input type="text" id="spotify-link" placeholder="https://open.spotify.com/track/..." />
    <button id="download-btn">Get Canvas 🐱</button>
    
    <p id="status-message"></p>
    <img id="canvas-image" style="display:none;" alt="Canvas or Album Art" />

    <footer>
      <p>Made with 💜 and cat vibes by Ethan</p>
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
